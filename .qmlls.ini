[General]
# qmlls lee este fichero en la raiz del proyecto (ver QT_QML_GENERATE_QMLLS_INI
# y `qmlls --help`: -E / -I / -b tienen mayor precedencia).
# El efecto es QML puro sin build CMake propio (native/ es solo el KCM),
# asi que se desactivan las llamadas automaticas a CMake.
no-cmake-calls=true
importPaths=/usr/lib/qt6/qml
