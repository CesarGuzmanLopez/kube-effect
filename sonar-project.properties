# SonarQube — servidor local http://localhost:9000 (instancia compartida kkube-sonar)
sonar.projectKey=kube-effect
sonar.projectName=Kube Effect
# La version la inyecta el Makefile (-Dsonar.projectVersion) desde package/metadata.json.
# Fijarla aqui seria una segunda copia que ademas deja de cambiar: si el analizador
# siempre ve la misma version no existe una 'anterior' (New Code = PREVIOUS_VERSION),
# las metricas new_* se quedan sin valor y el gate queda en ERROR permanente.
sonar.sourceEncoding=UTF-8
# package/ = efecto, scripts/ = arnés de prueba. Sin analizador QML/Sh aquí:
# .qml/.sh/.json se revisan como texto (secretos).
sonar.sources=package,scripts
sonar.exclusions=**/*.glb,**/*.png,**/*.svg
sonar.text.inclusions=**/*.qml,**/*.js,**/*.json,**/*.xml,**/*.yml,**/*.md,**/*.sh
